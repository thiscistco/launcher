<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Infinix GT30 Pro - Launcher Preview :3000</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; font-family:system-ui,sans-serif; gap:20px; }
  .device-info { text-align:center; }
  .device-info h1 { color:#fff; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; font-weight:700; }
  .device-info p { color:#666; font-size:11px; letter-spacing:1px; margin-top:6px; }
  .phones { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .phone-wrap { text-align:center; }
  .phone { width:300px; height:650px; background:#0a0a0a; border-radius:28px; padding:6px; box-shadow:0 0 0 1px #2a2a2a, 0 0 0 3px #000, 0 24px 64px rgba(0,0,0,0.85); position:relative; }
  .screen { width:100%; height:100%; background:#000; border-radius:22px; overflow:hidden; position:relative; }
  .wallpaper { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .bezel { position:absolute; inset:0; border-radius:22px; border:3px solid #000; pointer-events:none; z-index:5; }
  .punch-hole { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:18px; height:18px; background:radial-gradient(circle at 30% 30%,#1a1a1a 0%,#000 60%); border-radius:50%; border:1px solid #222; z-index:6; }
  /* Bar baterai UKURAN & KEMIRINGAN SESUAI 5 GARIS MIRING ASLI - persis ventilasi POWERTRAIN */
  /* Battery bars have zero spacing; center of the bottom bar is anchored at 290px. */
  .vent-battery { position:absolute; right:18.47px; top:223.292px; width:10.353px; display:flex; flex-direction:column-reverse; gap:0; z-index:7; }
  .vent-line { position:relative; flex:0 0 14.824px; width:10.353px; height:14.824px; background:#0a0a0a; overflow:hidden; clip-path:polygon(0 68.254%, 0 100%, 100% 31.746%, 100% 0); }
  .vent-line .fill { position:absolute; top:0; bottom:0; left:0; background:#FF6A00; box-shadow:0 0 4px #FF6A00; }
  .caption { margin-top:10px; color:#888; font-size:11px; text-align:center; }
  .caption b { color:#FF6A00; }
  .legend { background:#111; border:1px solid #222; border-radius:12px; padding:14px 18px; color:#888; font-size:11px; line-height:1.6; max-width:560px; text-align:center; }
  .legend b { color:#fff; }
</style>
</head>
<body>
  <div class="device-info">
    <h1>Infinix GT30 Pro — Launcher Preview :3000</h1>
    <p>Jarak antarbar 0px • titik tengah bar terbawah 290px dari atas layar</p>
  </div>

  <div class="phones">
    <!-- 5% = 1/4 garis -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <img class="wallpaper" src="../assets/wallpapers/default_wallpaper.jpg?v=17" alt="Wallpaper">
          <div class="vent-battery">
            <div class="vent-line"><div class="fill" style="width:25%"></div></div>
            <div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div>
          </div>
          <div class="bezel"></div><div class="punch-hole"></div>
        </div>
      </div>
      <div class="caption"><b>5%</b> = 1/4 garis miring</div>
    </div>

    <!-- 15% = 3/4 garis -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <img class="wallpaper" src="../assets/wallpapers/default_wallpaper.jpg?v=17" alt="Wallpaper">
          <div class="vent-battery">
            <div class="vent-line"><div class="fill" style="width:75%"></div></div>
            <div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div>
          </div>
          <div class="bezel"></div><div class="punch-hole"></div>
        </div>
      </div>
      <div class="caption"><b>15%</b> = 3/4 garis</div>
    </div>

    <!-- 40% = 2 garis -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <img class="wallpaper" src="../assets/wallpapers/default_wallpaper.jpg?v=17" alt="Wallpaper">
          <div class="vent-battery">
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div>
          </div>
          <div class="bezel"></div><div class="punch-hole"></div>
        </div>
      </div>
      <div class="caption"><b>40%</b> = 2 garis</div>
    </div>

    <!-- 100% = 5 garis -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <img class="wallpaper" src="../assets/wallpapers/default_wallpaper.jpg?v=17" alt="Wallpaper">
          <div class="vent-battery">
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
            <div class="vent-line"><div class="fill" style="width:100%"></div></div>
          </div>
          <div class="bezel"></div><div class="punch-hole"></div>
        </div>
      </div>
      <div class="caption"><b>100%</b> = 5 garis penuh</div>
    </div>
  </div>

  <div class="legend">
    <b>POSISI:</b> Jarak antarbar <b>0px</b>; titik tengah bar terbawah berada di <b>290px</b> dari atas layar
  </div>
</body>
</html>
