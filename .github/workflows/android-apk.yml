name: Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify Android SDK 34
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            failure_lines="$(grep -E '^e: ' gradle-build.log | tail -n 30 || true)"
            if [ -z "$failure_lines" ]; then
              failure_lines="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log | sed '$d' | head -n 36)"
            fi
            if [ -z "$failure_lines" ]; then
              failure_lines="$(grep -Ei 'requires.*compile|AAR metadata|metadata validation|Could not resolve|error:|Execution failed' gradle-build.log | tail -n 30 || true)"
            fi
            if [ -z "$failure_lines" ]; then
              failure_lines="$(tail -n 40 gradle-build.log)"
            fi
            {
              echo '### Gradle build failure'
              echo '```text'
              printf '%s\n' "$failure_lines"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sanitized="$(printf '%s' "$failure_lines" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')"
            echo "::error title=Gradle build failure::${sanitized}"
          fi

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: workos-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
